<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Progress - AI Study Assistant</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>

<body>

    <header class="dashboard-header">

        <div class="logo">

            <img
                src="images/logo.png"
                alt="AI Study Assistant Logo"
            >

            <span>
                AI Study Assistant
            </span>

        </div>


        <a
            href="dashboard.html"
            class="logout-button"
        >
            Dashboard
        </a>

    </header>


    <main class="progress-page">

        <section class="progress-container">

            <div class="progress-header">

                <h1>
                    My Progress
                </h1>

                <p>
                    Track your learning progress and study performance.
                </p>

            </div>


            <div class="progress-summary">

                <div class="progress-card">

                    <h2>
                        Study Tasks
                    </h2>

                    <p id="taskCount">
                        0
                    </p>

                </div>


                <div class="progress-card">

                    <h2>
                        Quiz Score
                    </h2>

                    <p id="quizScore">
                        0%
                    </p>

                </div>


                <div class="progress-card">

                    <h2>
                        Materials
                    </h2>

                    <p id="materialCount">
                        0
                    </p>

                </div>

            </div>


            <div class="progress-section">

                <h2>
                    Learning Progress
                </h2>


                <div class="progress-bar-container">

                    <div
                        id="progressBar"
                        class="progress-bar"
                    >
                        0%
                    </div>

                </div>


                <p id="progressMessage">
                    Start studying to track your progress.
                </p>

            </div>


            <div class="progress-section">

                <h2>
                    Study Summary
                </h2>


                <div
                    id="studySummary"
                    class="summary-box"
                >

                    <p>
                        Loading your learning activity...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="js/progress.js?v=5"></script>

</body>

</html>
