<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Study Chat - AI Study Assistant</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="dashboard-header">

        <div class="logo">

            <img
                src="images/logo.png"
                alt="AI Study Assistant Logo"
            >

            <span>
                AI Study Assistant
            </span>

        </div>


        <a
            href="dashboard.html"
            class="logout-button"
        >
            Dashboard
        </a>

    </header>


    <!-- =========================================
         CHAT PAGE
    ========================================== -->

    <main class="chat-page">

        <section class="chat-container">


            <!-- =====================================
                 CHAT HEADER
            ====================================== -->

            <div class="chat-header">

                <h1>
                    AI Study Chat
                </h1>

                <p>
                    Ask questions using text or your voice.
                </p>

            </div>


            <!-- =====================================
                 CHAT MESSAGES
            ====================================== -->

            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="message ai-message">

                    <strong>
                        AI Assistant
                    </strong>

                    <p>
                        Hello. Ask me a study question
                        by typing or speaking.
                    </p>

                </div>

            </div>


            <!-- =====================================
                 CHAT FORM
            ====================================== -->

            <form
                id="chatForm"
                class="chat-form"
            >


                <!-- SUBJECT -->

                <input
                    type="text"
                    id="subjectInput"
                    placeholder="Enter subject (e.g. Python)"
                    autocomplete="off"
                    required
                >


                <!-- QUESTION -->

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Type your study question..."
                    autocomplete="off"
                    required
                >


                <!-- VOICE BUTTON -->

                <button
                    type="button"
                    id="voiceButton"
                    class="voice-button"
                    title="Speak your question"
                >
                    🎤
                </button>


                <!-- ASK BUTTON -->

                <button
                    type="submit"
                    class="chat-button"
                >
                    Ask
                </button>

            </form>


            <!-- =====================================
                 VOICE STATUS
            ====================================== -->

            <p
                id="voiceStatus"
                class="voice-status"
            ></p>


        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/chat.js?v=1000"></script>

</body>

</html>
