<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Study Chat - AI Study Assistant</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>


<body>


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header class="dashboard-header">

        <div class="logo">

            <img
                src="images/logo.png"
                alt="AI Study Assistant Logo"
            >

            <span>
                AI Study Assistant
            </span>

        </div>


        <a
            href="dashboard.html"
            class="logout-button"
        >
            Dashboard
        </a>

    </header>



    <!-- ============================= -->
    <!-- CHAT PAGE -->
    <!-- ============================= -->

    <main class="chat-page">

        <section class="chat-container">


            <!-- ============================= -->
            <!-- CHAT HEADER -->
            <!-- ============================= -->

            <div class="chat-header">

                <h1>
                    AI Study Chat
                </h1>

                <p>
                    Ask questions and learn with your AI Study Assistant.
                </p>

            </div>



            <!-- ============================= -->
            <!-- SUBJECT -->
            <!-- ============================= -->

            <div class="chat-subject">

                <label for="subjectInput">
                    Subject
                </label>

                <input
                    type="text"
                    id="subjectInput"
                    placeholder="Enter subject"
                >

            </div>



            <!-- ============================= -->
            <!-- CHAT MESSAGES -->
            <!-- ============================= -->

            <div
                id="chatMessages"
                class="chat-messages"
            >

            </div>



            <!-- ============================= -->
            <!-- CHAT FORM -->
            <!-- ============================= -->

            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    type="text"
                    id="question"
                    placeholder="Ask your study question..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="voiceButton"
                    class="chat-button"
                >
                    🎤 Voice
                </button>


                <button
                    type="submit"
                    class="chat-button"
                >
                    Ask
                </button>

            </form>


            <p
                id="voiceStatus"
                class="voice-status"
            ></p>


        </section>

    </main>



    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="js/chat.js?v=4"></script>


</body>

</html>
