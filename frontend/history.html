<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat History - AI Study Assistant</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>

<body>

    <header class="dashboard-header">

        <div class="logo">

            <img
                src="images/logo.png"
                alt="AI Study Assistant Logo"
            >

            <span>
                AI Study Assistant
            </span>

        </div>


        <div class="dashboard-actions">

            <a
                href="dashboard.html"
                class="profile-button"
            >
                Dashboard
            </a>

        </div>

    </header>


    <main class="dashboard">

        <section class="welcome-section">

            <h1>
                Chat History
            </h1>

            <p>
                View your previous questions and AI answers.
            </p>

        </section>


        <section
            id="historyContainer"
            class="dashboard-cards"
        >

            <p>
                Loading chat history...
            </p>

        </section>

    </main>


    <script src="js/history.js?v=3"></script>

</body>

</html>
