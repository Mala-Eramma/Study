<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Study Assistant</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-page">

        <!-- Student Image Side -->
        <div class="register-image">
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQE1PdJk7261f_kxIDxoQZoVzUivLhuqmxbGfiJsT6FkQ&s=10"
                alt="Student studying"
            >
        </div>

        <!-- Registration Form Side -->
        <div class="auth-container">

            <h2>Create Account</h2>

            <p class="form-subtitle">
                Start your smart learning journey
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Register
                </button>
                <p id="registerMessage" class="register-message"></p>

            </form>

            <p class="switch-form">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/auth.js?v=4"></script>

</body>
</html>
